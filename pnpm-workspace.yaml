# pnpm 11 reads its behavioural settings from here, not from .npmrc, which is
# left holding only the registry mapping.

# Peer dependencies are declared, never inferred. Better Auth declares React
# peers it only needs in a browser build; auto-installing them would pull React
# into an image that serves JSON.
autoInstallPeers: false

# An explicit allow-list of the packages permitted to run install scripts.
# Everything else is installed as inert files, so a compromised transitive
# dependency cannot execute during `pnpm install`. Prisma is on the list because
# its engines download is that install script.
allowBuilds:
  "@prisma/engines": true
  esbuild: true
  prisma: true

# pnpm refuses packages published less than a day ago, which is a good default
# against a hijacked release and a bad one for first-party packages: a build
# triggered minutes after twofree-packages publishes would fail on its own
# dependency. The exclusion is scoped to packages this repository owns.
minimumReleaseAgeExclude:
  - "@camircode/*"

# Transitive dependencies pinned past a published fix. None is a direct
# dependency and none is reachable from the serving image's own code:
# deepmerge-ts and find-my-way arrive under the Prisma CLI and so live only in
# the migration image, and mysql2 is a driver better-auth declares for a
# database this application does not use. They ship inside the images all the
# same, so the scan sees them, and Trivy fails the build on HIGH or CRITICAL
# with a fix available.
#
# deepmerge-ts crosses a major version, which the Prisma CLI is not declared
# against. The smoke test is what settles that: it runs the migration image
# against a real PostgreSQL, so a CLI broken by this override fails there rather
# than in the cluster.
overrides:
  deepmerge-ts: 8.0.0
  find-my-way: 9.7.0
  mysql2: 3.22.0
